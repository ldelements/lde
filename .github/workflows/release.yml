name: Release

on:
  push:
    branches:
      - main
  # Manual trigger: releases whatever releasable conventional commits have
  # accumulated since the last tags; a no-op when there are none.
  workflow_dispatch:
    inputs:
      publish-only:
        description: Publish versions already tagged but missing from npm, without versioning
        type: boolean
        default: false

# One run at a time. A group holds a single pending run, so a newer push
# replaces an older pending one – harmless, because each run pulls main and
# releases everything up to it. That is also why a run for a release commit
# must not skip itself: it may be the pending run that replaced a merge's, and
# with nothing left to release it is a no-op that pushes nothing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # needed for provenance data generation and NPM trusted publishing OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full git history for nx release to work properly
          fetch-depth: 0
          filter: tree:0
          token: ${{ secrets.PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main (a previous release run may have pushed)
        run: git pull --rebase origin main

      # Versions, tags, pushes and publishes in one command, so the publish step
      # gets this run’s version data and publishes only the projects it gave a
      # new version. A run with nothing to version – such as the one a release
      # commit triggers – publishes nothing, instead of asking the registry what
      # is missing: the registry lists a new version only minutes after a
      # publish, so asking it made that run publish the same versions again and
      # fail with a 409.
      #
      # Publishes via npm OIDC trusted publishing (see id-token: write above), which
      # mints a short-lived credential per run – no long-lived npm token needed.
      - name: Release
        if: ${{ !inputs.publish-only }}
        run: npx nx release --yes
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }} # Needed for pushing release commits.
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: true

      # Recovery for a run that tagged versions but failed to publish some: a
      # later run versions nothing new and so publishes nothing. This publishes
      # every project’s current version, skipping those already on npm.
      - name: Build
        if: ${{ inputs.publish-only }}
        run: npx nx run-many -t build
      - name: Publish only
        if: ${{ inputs.publish-only }}
        run: npx nx release publish
        env:
          NPM_CONFIG_ACCESS: public
          NPM_CONFIG_PROVENANCE: true
