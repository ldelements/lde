name: Nx migrate

on:
  schedule:
    - cron: '0 6 * * *' # Every night at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - run: npm ci

      # Touches package.json only when Nx has an update. Gate every later step
      # on that: npm install would otherwise sync the lockfile drift that
      # nx release leaves behind and open a PR without any Nx migration.
      - id: migrate
        run: |
          npx nx migrate latest
          git diff --quiet -- package.json || echo "updated=true" >> "$GITHUB_OUTPUT"

      - if: steps.migrate.outputs.updated == 'true'
        run: npm install

      - if: steps.migrate.outputs.updated == 'true' && hashFiles('migrations.json') != ''
        run: npx nx migrate --run-migrations | tee "$RUNNER_TEMP/migrate.log"

      # Nx skips agent-driven migrations in CI and lists their prompt files;
      # put those in the PR description instead of committing them.
      - name: Describe migration
        if: steps.migrate.outputs.updated == 'true'
        id: describe
        run: |
          version=$(node -p "require('./package.json').devDependencies.nx")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          body="$RUNNER_TEMP/pr-body.md"
          echo 'Automated Nx migration to '"$version"' by `nx migrate`, including its code migrations.' > "$body"
          prompts=$(grep -oE '^[[:space:]]*- tools/ai-migrations/[^[:space:]]+\.md' "$RUNNER_TEMP/migrate.log" 2>/dev/null | sed -E 's/^[[:space:]]*- //' || true)
          for prompt in $prompts; do
            printf '\n<details><summary>Apply before merging: <code>%s</code></summary>\n\n%s\n\n</details>\n' "$prompt" "$(cat "$prompt")" >> "$body"
          done
          rm -rf migrations.json tools/ai-migrations

      - id: app-token
        if: steps.migrate.outputs.updated == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      # A fixed branch keeps a single migration PR open: each run updates it
      # on top of main instead of opening another.
      - uses: peter-evans/create-pull-request@v8
        if: steps.migrate.outputs.updated == 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: build/nx-migrate
          commit-message: 'build(deps): migrate Nx to ${{ steps.describe.outputs.version }}'
          title: 'build(deps): migrate Nx to ${{ steps.describe.outputs.version }}'
          body-path: ${{ runner.temp }}/pr-body.md
